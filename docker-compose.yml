services:
  fortiscope:
    build:
      context: .
      dockerfile: Dockerfile
    image: fortiscope:local
    ports:
      - "${FORTISCOPE_PORT:-8080}:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Production}
      ASPNETCORE_URLS: http://+:8080
      HttpsRedirectionEnabled: ${HttpsRedirectionEnabled:-false}
      Snmp__Port: ${Snmp__Port:-161}
      Snmp__Version: ${Snmp__Version:-v3}
      Snmp__SecurityLevel: ${Snmp__SecurityLevel:-authPriv}
      Snmp__AuthenticationProtocol: ${Snmp__AuthenticationProtocol:-SHA1}
      Snmp__PrivacyProtocol: ${Snmp__PrivacyProtocol:-AES128}
      Snmp__TimeoutMilliseconds: ${Snmp__TimeoutMilliseconds:-3000}
      Snmp__AuthPassword: ${Snmp__AuthPassword:-}
      Snmp__PrivacyPassword: ${Snmp__PrivacyPassword:-}
    volumes:
      - fortiscope_data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--show-error", "http://127.0.0.1:8080/health"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3

volumes:
  fortiscope_data:
    name: fortiscope_data
